<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="teaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.1)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.3)"/>
    </linearGradient>
    <filter id="bevSh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="600" height="400" fill="#14213d"/>
  <circle cx="300" cy="180" r="120" fill="rgba(14, 165, 233, 0.12)"/>

  <!-- Steel Davarah & Tumbler (Filter Coffee) on Left -->
  <!-- Saucer / Davarah -->
  <ellipse cx="230" cy="245" rx="50" ry="16" fill="#94a3b8" filter="url(#bevSh)"/>
  <ellipse cx="230" cy="242" rx="46" ry="13" fill="#e2e8f0"/>
  <!-- Tumbler -->
  <path d="M 210 170 L 216 238 Q 230 242 244 238 L 250 170 Z" fill="#cbd5e1" filter="url(#bevSh)"/>
  <ellipse cx="230" cy="170" rx="20" ry="6" fill="#78350f"/>
  <ellipse cx="230" cy="169" rx="17" ry="4" fill="#fef3c7"/> <!-- Froth -->
  <path d="M 225 155 Q 220 135 228 115 T 224 90" fill="none" stroke="#fcd34d" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Cutting Chai Glass (Center) -->
  <path d="M 285 160 L 292 245 Q 310 248 328 245 L 335 160 Z" fill="url(#teaGrad)" filter="url(#bevSh)"/>
  <path d="M 283 158 L 290 247 Q 310 250 330 247 L 337 158 Z" fill="url(#glassGrad)"/>
  <ellipse cx="310" cy="158" rx="27" ry="7" fill="#b45309" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
  <path d="M 305 145 Q 315 125 305 105 T 312 80" fill="none" stroke="#fcd34d" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <path d="M 320 148 Q 328 130 322 110 T 326 85" fill="none" stroke="#fcd34d" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Tall Lassi / Cold Drink Glass with Straw on Right -->
  <path d="M 370 140 L 380 245 Q 400 248 420 245 L 430 140 Z" fill="#fef08a" opacity="0.85" filter="url(#bevSh)"/>
  <path d="M 368 138 L 378 247 Q 400 250 422 247 L 432 138 Z" fill="url(#glassGrad)"/>
  <ellipse cx="400" cy="138" rx="32" ry="8" fill="#fef9c3" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
  <!-- Whipped cream / malai top -->
  <circle cx="400" cy="132" r="14" fill="#ffffff"/>
  <!-- Pistachio garnish -->
  <circle cx="396" cy="128" r="3" fill="#16a34a"/>
  <circle cx="404" cy="132" r="2.5" fill="#ca8a04"/>
  <!-- Straw -->
  <line x1="395" y1="140" x2="425" y2="85" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round"/>

  <!-- Footer text -->
  <rect x="0" y="325" width="600" height="75" fill="rgba(11, 19, 36, 0.85)"/>
  <text x="300" y="358" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="1">REFRESHING BEVERAGES</text>
  <text x="300" y="382" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#cbd5e1" text-anchor="middle">Filter Coffee, Masala Chai, Lassi, Lime Soda &amp; Badam Milk</text>

  <!-- Veg tag -->
  <rect x="25" y="25" width="28" height="28" rx="5" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <circle cx="39" cy="39" r="6.5" fill="#16a34a"/>
</svg>
