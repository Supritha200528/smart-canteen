<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="ffSh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="600" height="400" fill="#14213d"/>
  <circle cx="300" cy="180" r="120" fill="rgba(239, 68, 68, 0.12)"/>

  <!-- Platter -->
  <ellipse cx="300" cy="245" rx="160" ry="28" fill="#cbd5e1" filter="url(#ffSh)"/>

  <!-- Veg Burger Center -->
  <!-- Bottom bun -->
  <path d="M 230 225 Q 300 235 370 225 L 365 240 Q 300 250 235 240 Z" fill="url(#bunGrad)" filter="url(#ffSh)"/>
  <!-- Patty -->
  <rect x="235" y="210" width="130" height="16" rx="6" fill="#78350f"/>
  <!-- Melted Cheese -->
  <polygon points="230,210 370,210 350,222 330,213 310,224 290,212 270,222 250,212 230,220" fill="#facc15"/>
  <!-- Lettuce -->
  <path d="M 225 204 Q 240 212 255 204 Q 270 212 285 204 Q 300 212 315 204 Q 330 212 345 204 Q 360 212 375 204" stroke="#16a34a" stroke-width="6" fill="none"/>
  <!-- Tomato slice -->
  <rect x="245" y="194" width="110" height="10" rx="4" fill="#dc2626"/>
  <!-- Top bun -->
  <path d="M 230 195 C 230 135, 370 135, 370 195 Z" fill="url(#bunGrad)" filter="url(#ffSh)"/>
  <!-- Sesame seeds -->
  <ellipse cx="280" cy="165" rx="3" ry="1.5" fill="#fef3c7"/>
  <ellipse cx="320" cy="160" rx="3" ry="1.5" fill="#fef3c7"/>
  <ellipse cx="300" cy="150" rx="3" ry="1.5" fill="#fef3c7"/>
  <ellipse cx="265" cy="180" rx="3" ry="1.5" fill="#fef3c7"/>
  <ellipse cx="335" cy="175" rx="3" ry="1.5" fill="#fef3c7"/>

  <!-- French Fries Cup on Side -->
  <path d="M 390 180 L 400 240 L 440 240 L 450 180 Z" fill="#ef4444" filter="url(#ffSh)"/>
  <rect x="400" y="140" width="8" height="60" fill="#facc15" transform="rotate(-10 400 140)"/>
  <rect x="415" y="135" width="8" height="65" fill="#fbbf24"/>
  <rect x="428" y="142" width="8" height="60" fill="#facc15" transform="rotate(8 428 142)"/>

  <!-- Footer text -->
  <rect x="0" y="325" width="600" height="75" fill="rgba(11, 19, 36, 0.85)"/>
  <text x="300" y="358" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="800" fill="#ef4444" text-anchor="middle" letter-spacing="1">FAST FOOD &amp; QUICK BITES</text>
  <text x="300" y="382" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#cbd5e1" text-anchor="middle">Burgers, Sandwiches, Noodles, Fried Rice &amp; Fries</text>

  <!-- Veg tag -->
  <rect x="25" y="25" width="28" height="28" rx="5" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <circle cx="39" cy="39" r="6.5" fill="#16a34a"/>
</svg>
