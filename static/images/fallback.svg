<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14213d"/>
      <stop offset="60%" stop-color="#1f2f54"/>
      <stop offset="100%" stop-color="#2a3b63"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)"/>
  
  <!-- Subtle circular backdrop -->
  <circle cx="300" cy="180" r="110" fill="rgba(242, 169, 0, 0.08)"/>
  <circle cx="300" cy="180" r="85" fill="rgba(242, 169, 0, 0.12)"/>

  <!-- Platter Plate -->
  <ellipse cx="300" cy="225" rx="140" ry="24" fill="#0b1324" opacity="0.5"/>
  <ellipse cx="300" cy="220" rx="130" ry="20" fill="#e2e8f0" filter="url(#shadow)"/>
  <ellipse cx="300" cy="220" rx="115" ry="15" fill="#f8fafc"/>
  <ellipse cx="300" cy="219" rx="100" ry="11" fill="url(#goldGrad)" opacity="0.3"/>

  <!-- Cloche / Food Dome Cover -->
  <path d="M 200 215 C 200 130, 400 130, 400 215 Z" fill="url(#goldGrad)" filter="url(#shadow)"/>
  <ellipse cx="300" cy="215" rx="100" ry="8" fill="#b45309"/>
  <!-- Cloche Handle -->
  <circle cx="300" cy="126" r="14" fill="#fef3c7"/>
  <circle cx="300" cy="126" r="8" fill="#d97706"/>

  <!-- Steam curves -->
  <path d="M 280 105 Q 270 85 285 70 T 275 45" fill="none" stroke="#fcd34d" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
  <path d="M 300 102 Q 315 82 300 66 T 310 40" fill="none" stroke="#fcd34d" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
  <path d="M 320 108 Q 330 88 315 72 T 325 48" fill="none" stroke="#fcd34d" stroke-width="3" stroke-linecap="round" opacity="0.75"/>

  <!-- Bottom Brand Text Banner -->
  <rect x="0" y="325" width="600" height="75" fill="rgba(11, 19, 36, 0.75)"/>
  <text x="300" y="355" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">SMART CANTEEN SPECIAL</text>
  <text x="300" y="380" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#cbd5e1" text-anchor="middle">Freshly Prepared Campus Dining</text>

  <!-- Veg Icon Top Left -->
  <rect x="25" y="25" width="28" height="28" rx="5" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <circle cx="39" cy="39" r="6.5" fill="#16a34a"/>
</svg>
