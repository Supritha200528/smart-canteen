<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="samGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="60%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="snSh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="600" height="400" fill="#14213d"/>
  <circle cx="300" cy="180" r="120" fill="rgba(217, 119, 6, 0.12)"/>

  <!-- Platter -->
  <ellipse cx="300" cy="240" rx="160" ry="32" fill="#cbd5e1" filter="url(#snSh)"/>
  <ellipse cx="300" cy="235" rx="145" ry="26" fill="#f8fafc"/>

  <!-- Samosa 1 (Left) -->
  <polygon points="210,135 150,230 270,230" fill="url(#samGrad)" filter="url(#snSh)"/>
  <path d="M 205 140 Q 215 185 210 225" stroke="#78350f" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- Samosa 2 (Center) -->
  <polygon points="320,125 255,225 385,225" fill="url(#samGrad)" filter="url(#snSh)"/>
  <path d="M 315 130 Q 325 180 320 220" stroke="#78350f" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- Chutney Bowls -->
  <circle cx="430" cy="210" r="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="430" cy="210" r="20" fill="#15803d"/> <!-- Green Mint -->

  <circle cx="380" cy="235" r="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="380" cy="235" r="16" fill="#7f1d1d"/> <!-- Sweet Tamarind -->

  <!-- Fried Green Chillies -->
  <path d="M 180 235 Q 210 248 240 235" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
  <path d="M 175 233 L 165 230" stroke="#14532d" stroke-width="2"/>

  <!-- Footer text -->
  <rect x="0" y="325" width="600" height="75" fill="rgba(11, 19, 36, 0.85)"/>
  <text x="300" y="358" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="800" fill="#f59e0b" text-anchor="middle" letter-spacing="1">CANTEEN SNACKS &amp; CHAAT</text>
  <text x="300" y="382" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#cbd5e1" text-anchor="middle">Samosas, Pav Bhaji, Vada Pav, Pakodas &amp; Bhel</text>

  <!-- Veg tag -->
  <rect x="25" y="25" width="28" height="28" rx="5" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <circle cx="39" cy="39" r="6.5" fill="#16a34a"/>
</svg>
